<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Site settings</title>
    <script src="sdpi-components.js"></script>
    <script src="connection.js"></script>
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <div id="evcc-connection"></div>

    <div class="requires-connection" hidden>
      <sdpi-item label="Value">
        <sdpi-select setting="value" default="pv">
          <option value="pv">PV production</option>
          <option value="grid">Grid power (import / export)</option>
          <option value="battery">Battery SoC</option>
          <option value="home">Home consumption</option>
        </sdpi-select>
      </sdpi-item>

      <p class="hint">
        Press the key to switch to the next value. The other three values are shown small at the bottom of the key.
      </p>
    </div>
  </body>
</html>
